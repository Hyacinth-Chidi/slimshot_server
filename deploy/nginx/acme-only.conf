# Temporary site used only while the first certificate is issued: answers
# Let's Encrypt's HTTP challenge and nothing else. setup-nginx.sh replaces it
# with slimshot-api.conf once the certificate exists. __DOMAIN__ is filled in
# by setup-nginx.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
