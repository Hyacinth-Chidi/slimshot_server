# The public HTTPS entrance to the SlimShot API. Installed as
# /etc/nginx/sites-available/slimshot-api by setup-nginx.sh, which fills in
# __DOMAIN__. Certificates come from Let's Encrypt (certbot) and renew
# automatically; the renewal reloads nginx.

# Per-IP limits on the sign-in routes, on top of the API's own limits.
limit_req_zone $binary_remote_addr zone=slimshot_auth:10m rate=30r/m;

upstream slimshot_api {
    server 127.0.0.1:2700;
    keepalive 32;
}

# HTTP: certificate renewals, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which takes http2 on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:slimshot_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caption uploads are up to 50 MB (CAPTION_MAX_UPLOAD_BYTES).
    client_max_body_size 60m;
    client_body_timeout 180s;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    access_log /var/log/nginx/slimshot-api.access.log;
    error_log /var/log/nginx/slimshot-api.error.log warn;

    location /api/app/v1/auth/ {
        limit_req zone=slimshot_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/slimshot-proxy.conf;
    }

    location /api/admin/v1/auth/ {
        limit_req zone=slimshot_auth burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/slimshot-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/slimshot-proxy.conf;
    }
}
