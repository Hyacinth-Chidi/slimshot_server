# Shared by every location that forwards to the API (installed as
# /etc/nginx/snippets/slimshot-proxy.conf by setup-nginx.sh).

proxy_pass http://slimshot_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The API runs with TRUST_PROXY=1: it takes the client address from the last
# X-Forwarded-For entry, the one this nginx appends.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 10s;
# Long enough for a 50 MB caption upload on a slow phone connection.
proxy_send_timeout 180s;
proxy_read_timeout 180s;
